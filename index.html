<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#caff00" />
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem("earnist-theme"); } catch {}
      if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#111b16" : "#f5f7f4";
    })();
  </script>
  <meta name="description" content="Earnist's local income, expense, receipt, mileage, and reporting demo, built by AiBit Sol." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23caff00'/%3E%3Cpath d='M12 11h18v5H17v3h11v4H17v3h13v5H12z' fill='%23151515'/%3E%3C/svg%3E" />
  <title>Earnist · Local workspace</title>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
